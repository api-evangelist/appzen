swagger: '2.0'
info:
  title: Autonomous AP APIs Chart of Accounts Processed Invoices API
  description: Public APIs for integrating with Autonomous AP
  version: 2.0.3
host: <env>.appzen.com
basePath: /dictionary-data-services
schemes:
- https
security:
- API Key Header: []
  Customer Id Header: []
  Customer Key Header: []
tags:
- name: Processed Invoices
paths:
  /invoice/processed-invoice/{uuid}:
    get:
      tags:
      - Processed Invoices
      summary: Returns the processed invoice
      description: Returns the processed results and invoice by uuid. It includes the risk at invoice header level, such as LOW, MEDIUM, HIGH, the overall invoice status, such as Approved, Rejected and invoice detail. The download links to the images are valid for only 5 minutes.
      parameters:
      - $ref: '#/parameters/uuid'
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/processed-invoice-json-schema'
        400:
          description: Bad Request
          schema:
            $ref: '#/definitions/http-400-error-response'
        401:
          description: Unauthorized
          schema:
            $ref: '#/definitions/http-401-error-response'
        403:
          description: Forbidden
          schema:
            $ref: '#/definitions/http-403-error-response'
        404:
          description: Not Found
          schema:
            $ref: '#/definitions/http-404-error-response'
        500:
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http-500-error-response'
definitions:
  withholding-tax:
    type: object
    properties:
      type:
        type: string
      code:
        type: string
      base_amount:
        type: object
        required:
        - amount
        - currency
        properties:
          amount:
            type: number
          currency:
            type: string
      wht_amount:
        type: object
        required:
        - amount
        - currency
        properties:
          amount:
            type: number
          currency:
            type: string
  payment_type:
    type: string
    enum:
    - ACH
    - DOMESTIC_WIRE
    - SEPA_CREDIT_TRANSFER
    - INTERNATIONAL_WIRE_SWIFT
    - BACS
    - BECS
    - CHECK_PAPER
    - REAL_TIME_PAYMENTS
    - VIRTUAL_CARD
  invoice_line_type:
    type: string
    enum:
    - NONE_LINE_TYPE
    - GOODS
    - SERVICE
    - FREIGHT
    - TAX
    - MISCELLANEOUS
  validation:
    type: object
    properties:
      action_type:
        type: string
      confidence:
        type: string
      field_name:
        type: string
      final_risk:
        type: string
      post_config_risk:
        type: string
      post_feedback_risk:
        type: string
      result_data:
        type: object
        properties:
          ai_model_detected:
            type: array
            items:
              type: string
          duplicate_invoice_ids:
            type: array
            items:
              type: string
          electronic_query_detected:
            type: array
            items:
              type: string
      risk_level:
        type: string
      risk_reason:
        type: string
      state:
        type: string
      validation_display_name:
        type: string
      validation_id:
        type: string
      validation_name:
        type: string
  addressCore:
    required:
    - address_line1
    - country
    - zip
    properties:
      address_line1:
        default: ''
        title: The address_line1 schema
        type: string
        example: 12345 MARKET STREET
      address_line2:
        default: ''
        title: The address_line2 schema
        type: string
        example: SUITE 1234
      address_line3:
        default: ''
        title: The address_line3 schema
        type: string
        example: ''
      area_code:
        default: ''
        title: The area_code schema
        type: string
        example: '415'
      city:
        default: ''
        title: The city schema
        type: string
        example: SAN FRANCISCO
      company:
        default: ''
        title: The company schema
        type: string
        example: Preferred Supplier Inc.
      contact:
        default: ''
        title: The contact schema
        type: string
        example: Jane Doe
      country:
        default: ''
        title: The country schema
        type: string
        example: US
      country_iso3:
        default: ''
        title: The country_iso3 schema
        type: string
        example: USA
      email:
        default: ''
        title: The email schema
        type: string
        example: janedoe@supplier.com
      phone:
        default: ''
        title: The phone schema
        type: string
        example: '4042965282'
      province:
        default: ''
        title: The province schema
        type: string
        example: ''
      state:
        default: ''
        title: The state schema
        type: string
        example: CA
      zip:
        default: ''
        title: The zip schema
        type: string
        example: '94016'
  amount:
    properties:
      amount:
        example: 1.5
        type: number
      currency:
        example: USD
        type: string
    type: object
  invoice-goods-receipt:
    type: object
    properties:
      receipt_id:
        type: string
        example: 123AB
        description: The Receipt ID from source system
      amount:
        allOf:
        - $ref: '#/definitions/amount'
        - description: Amount allocated to invoice from this receipt
      quantity:
        type: integer
        format: int32
        example: 10
        description: Quantity allocated to invoice from this receipt
  payment-term:
    properties:
      name:
        description: Payment term name as mentioned in the ERP system
        type: string
        example: NET 30
      id:
        description: Payment term id that uniquely identifies a payment term in the ERP system
        type: string
        example: '8900012'
      active:
        description: If payment term is active in the ERP system
        default: true
        type: boolean
      code:
        default: ''
        example: NET
        description: Refers to the AppZen Code. Should be one from the mentioned here.
        enum:
        - NONE_PAYMENT_TERM_CODE
        - NET
        - EOM
        - FOM
        - PIA
        - CWO
        - DOR
        type: string
      date:
        allOf:
        - $ref: '#/definitions/date-time'
      discounts:
        $ref: '#/definitions/discounts'
      num_days:
        default: ''
        example: 30
        description: Number of days for payment to be made.
        type: integer
      num_grace_days:
        example: 0
        description: Number of grace days available for the payment
        type: integer
      custom_json:
        type: object
      entities_list:
        description: list of external identifier for entities that this payment term is associated with
        type: array
        items:
          type: string
    required:
    - id
    - name
  po_receipt_type:
    type: string
    enum:
    - PO
    - GOODS_RECEIPT
  po_policy_match_type:
    type: string
    enum:
    - PO_NONE_MATCH_TYPE
    - PO_POLICY_TWO_WAY_MATCH
    - PO_POLICY_THREE_WAY_MATCH
  address:
