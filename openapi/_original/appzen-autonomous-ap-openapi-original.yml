        allOf:
          - $ref: '#/definitions/date-time'
      valid_end_date:
        allOf:
          - $ref: '#/definitions/date-time'
      uuid:
        type: string
        example: '5fc03087-d265-11e7-b8c6-83e29cd24f4c'

  appzen-segment-id:
    type: object
    properties:
      appzen-segment-id:
        type: string
        example: '2343454622'

  appzen-invoice-id:
    type: object
    properties:
      appzen-invoice-id:
        type: string
        example: '2343454622'

  http-400-error-response:
    type: object
    properties:
      timestamp:
        type: string
        example: "2019-01-17T16:12:45.977+0000"
      status:
        type: string
        example: 400
      error:
        type: string
        example: Bad Request
      message:
        type: string
        example: "Error code : 17e3338d - Invalid request, please fix and resend"

  http-401-error-response:
    type: object
    properties:
      timestamp:
        type: string
        example: "2019-01-17T16:12:45.977+0000"
      status:
        type: string
        example: 401
      error:
        type: string
        example: Unauthorized
      message:
        type: string
        example: "Error code : 17e3338d - Unable to authenticate credentials"

  http-403-error-response:
    type: object
    properties:
      timestamp:
        type: string
        example: "2019-01-17T16:12:45.977+0000"
      status:
        type: string
        example: 403
      error:
        type: string
        example: Forbidden
      message:
        type: string
        example: "Error code : 17e3338d - You do not have permission to access this resource"

  http-404-error-response:
    type: object
    properties:
      timestamp:
        type: string
        example: "2019-01-17T16:12:45.977+0000"
      status:
        type: string
        example: 404
