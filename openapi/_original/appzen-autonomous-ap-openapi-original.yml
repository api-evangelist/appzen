  ######### DOCUMENT ##########
  /generate-upload-url:
    get:
      tags:
        - Documents
      summary: Generates a url to upload a document into AppZen repository.
      description: |
        This is first part of a two part process for uploading a document into AppZen repository.
        1) Generate URL
            ```

            curl --location \
              --request GET 'https://<api-gateway-url>/dictionary-data-services/generate-upload-url' \
              --header 'x-api-key: <x-api-key>' \
              --header 'customer-id: <customer-id>' \
              --header 'customer-key: <customer-key>'

            ```
        2) The JSON reponse contains three elements.
            A `uuid` field contains the identifier of the document to be uploaded.
            An `url` field is a one-time unique URL.
            An `expires` field is the expiration timestamp of the url field. Example JSON response:
            ```
            {
              "url": "https://<download-link>",
              "uuid": "5fc03087-d265-11e7-b8c6-83e29cd24f4c",
              "expires": "2021-02-23T22:20:47.636Z"
            }
            ```

        3) Using the URL generated above, upload a document/attachment via an additional PUT API call, such as in the following example.
            A document attachment is limited to max size of 25MB.

            ```
            curl --location \
              --request PUT 'https://<download-link>' \
              --data-binary '@/<local_file_path>/Attachment_012.pdf'
            ```
        4) The uuid returned in 2), such as `5fc03087-d265-11e7-b8c6-83e29cd24f4c` in the example, can be used to link the attachment, to an invoice.

      produces:
        - 'application/json'

      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/signed-url-response'
        400:
          description: Bad Request
          schema:
            $ref: '#/definitions/http-400-error-response'
        401:
          description: Unauthorized
          schema:
            $ref: '#/definitions/http-401-error-response'
        403:
          description: Forbidden
          schema:
            $ref: '#/definitions/http-403-error-response'
        404:
          description: Not Found
          schema:
            $ref: '#/definitions/http-404-error-response'
        500:
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http-500-error-response'


