        type: string
        example: 500
      error:
        type: string
        example: Internal Server Error
      message:
        type: string
        example: "Error code : 17e3338d - Unable to process your request at this moment, please try again later"

  entity:
    properties:
      entity_id:
        description: Unique id distinguishing entity from other entity (PK)
        type: string
      entity_name:
        description: Valid entity name present used in the ERP system
        type: string
      parent_entity_id:
        description: Valid parent entity id present in the ERP system
        type: string
      entity_type:
        description: Entity type defined within the customer's ERP system
        type: string
      appzen_entity_type:
        description: Value for appzen to understand this entity. Refer to the entity enum for recognized values.
        example: "LEGAL_ENTITY"
        enum: [ 'LEGAL_ENTITY', 'OTHER_ENTITY', 'COMPANY' ]
        type: string
      entity_alias_name:
        default: ''
        description: All the alias names that refers to this entity
        type: array
      addresses:
        allOf:
          - $ref: '#/definitions/entity-addresses'
      currency:
        description: Default currency associated to this entity
        type: string
      coa_structure:
        description: This is case sensitive list of coa structure. It should be in the same sequence as gl-code in the ERP system.
        example: [ 'Entity', "Department", "Line of Business", "Future1" ]
        type: array
      appzen_coa_structure:
        description: Refers to the AppZen mapped values. Please provide the mapped values in the same sequence as the customer coa_structure. OTHER_SEGMENT should be used to map any customer segment type that does not have correspondence with one of the named appzen segment types (e.g. ACCOUNT_SEGMENT, DEPARTMENT_SEGMENT etc). Multiple OTHER_SEGMENT mappings may be specified, if needed.
        example: [ 'LEGAL_ENTITY_SEGMENT', "DEPARTMENT_SEGMENT", "OTHER_SEGMENT", "OTHER_SEGMENT" ]
        type: array
      dataset_lookup_names:
        description: one to one mapping with coa_structure fields to specify optional lookup contexts.
        allOf:
          - $ref: '#/definitions/data-lookup-names'
      optional_segments:
        description: This is case sensitive list of items from coa_structure that are optional.
        example: [ "Department", "Future1" ]
        type: array
      is_active:
        description: If entity is active in the ERP system
        default: true
        type: boolean
      valid_start_date:
        allOf:
          - $ref: '#/definitions/date-time'
      valid_end_date:
        allOf:
          - $ref: '#/definitions/date-time'
      created_date:
        allOf:
          - $ref: '#/definitions/date-time'
      updated_date:
        allOf:
          - $ref: '#/definitions/date-time'
      payment_term_id:
        description: Payment term id associated with this entity
        type: string
      custom_json:
        type: object
        example:
          bu_id: 382
          bu_name: HR
    required:
      - entity_id
      - entity_name
      - entity_type
      - appzen_entity_type
      - currency
      - addresses

  ######### USER GROUP ENUMS ##########
  group-category:
    type: string
    description: Purpose of the group.
    enum:
      - TRANSACTION_ASSIGNMENT
      - BIZ_USER_ASSIGNMENT
      - APPROVAL_ASSIGNMENT
    example: APPROVAL_ASSIGNMENT

  group-status:
    type: string
    description: Lifecycle status of the group.
    enum:
      - ACTIVE
      - DISABLED
    default: ACTIVE
    example: ACTIVE

  group-notification-method:
    type: string
    description: How notifications are delivered to the group.
    enum:
      - GROUP_NOTIFICATION_METHOD_SEND_TO_MEMBERS
      - GROUP_NOTIFICATION_METHOD_SEND_TO_GROUP_ALIAS
      - GROUP_NOTIFICATION_METHOD_SEND_TO_BOTH
    default: GROUP_NOTIFICATION_METHOD_SEND_TO_MEMBERS
    example: GROUP_NOTIFICATION_METHOD_SEND_TO_MEMBERS

  group-management-source:
    type: string
    description: Who owns the group.
    enum:
      - APPZEN_MANAGED
      - EXTERNALLY_MANAGED
    example: EXTERNALLY_MANAGED

  group-product:
    type: string
    description: AppZen product the group belongs to.
    enum:
      - PRODUCT_AP
      - PRODUCT_EXPENSE
      - PRODUCT_SPEND_AUDIT
      - PRODUCT_AUTONOMOUS_INBOX
      - PRODUCT_AGENTS
    example: PRODUCT_AP

  ######### USER GROUP MEMBERS ##########
  user-group-member-input:
    type: object
    description: A group member to assign.
    properties:
      user_id:
        type: string
        description: The AppZen user id of the member. If it is not an existing AppZen user, the member is skipped and returned in `unresolved_user_ids`.
        example: "az-user-90211"
    required:
      - user_id

  ######### USER GROUP REQUEST ##########
  user-group-json-schema:
    type: object
    description: Request body for creating/updating a user group.
    properties:
      external_group_id:
        type: string
        description: Identifier of the group in the external system. Identity / upsert key.
        example: "AP-GROUP-1001"
      management_source:
        description: Required. Who owns the group.
        allOf:
          - $ref: '#/definitions/group-management-source'
      category:
        $ref: '#/definitions/group-category'
      product:
        $ref: '#/definitions/group-product'
      group_name:
        type: string
        description: Display name of the group. Optional.
        example: "AP Approvers - North America"
      group_description:
        type: string
        description: Description of the group. Optional.
        example: "Approvers for North America AP invoices"
      group_email:
        type: string
        description: Group email alias. Optional.
        example: "ap-approvers-na@abc.com"
      notification_method:
        $ref: '#/definitions/group-notification-method'
      status:
        $ref: '#/definitions/group-status'
      source_created_at:
        description: When the group was created in the source system. Optional.
        allOf:
          - $ref: '#/definitions/date-time'
      source_last_updated_at:
        description: When the group was last modified in the source system. Optional.
        allOf:
          - $ref: '#/definitions/date-time'
      members:
        type: array
        description: The group's members. Replaced in full on each create/update. Any user_id that is not an existing AppZen user is skipped and returned in `unresolved_user_ids`; the request still succeeds.
        items:
          $ref: '#/definitions/user-group-member-input'
    required:
      - external_group_id
      - management_source
      - category
      - product

  ######### USER GROUP RESPONSE ##########
  user-group-member:
    type: object
    description: A group member as returned by the API.
    properties:
      user_id:
        type: string
        example: "az-user-90211"
      first_name:
        type: string
        example: "John"
      last_name:
        type: string
        example: "Doe"
      email:
        type: string
        example: "john.doe@abc.com"
      added_at:
        allOf:
          - $ref: '#/definitions/date-time'
      added_by:
        type: string
        description: AppZen user id who added this member.
        example: "az-user-00001"

  user-group:
    type: object
    description: A user group as returned by the API.
    properties:
      group_id:
        type: string
        description: AppZen-assigned unique identifier for the group (read-only).
        example: "734512"
      customer_id:
        type: string
        description: AppZen customer id (read-only).
        example: "488059"
      external_group_id:
        type: string
        example: "AP-GROUP-1001"
      management_source:
        $ref: '#/definitions/group-management-source'
      category:
        $ref: '#/definitions/group-category'
      product:
        $ref: '#/definitions/group-product'
      group_name:
        type: string
        example: "AP Approvers - North America"
      group_description:
        type: string
        example: "Approvers for North America AP invoices"
      group_email:
        type: string
        example: "ap-approvers-na@abc.com"
      notification_method:
        $ref: '#/definitions/group-notification-method'
      status:
        $ref: '#/definitions/group-status'
      members:
        type: array
        items:
          $ref: '#/definitions/user-group-member'
      source_created_at:
        allOf:
          - $ref: '#/definitions/date-time'
      source_last_updated_at:
        allOf:
          - $ref: '#/definitions/date-time'
      created_at:
        allOf:
          - $ref: '#/definitions/date-time'
      created_by:
        type: string
        example: "az-user-00001"
      updated_at:
        allOf:
          - $ref: '#/definitions/date-time'
      updated_by:
        type: string
        example: "az-user-00001"

  user-group-sync-result:
    type: object
    description: Result of a create/update (POST) operation.
    properties:
      group_id:
        type: string
        description: AppZen-assigned unique identifier for the group.
        example: "734512"
      external_group_id:
        type: string
        example: "AP-GROUP-1001"
      management_source:
        description: The `management_source` the group was created/updated with.
        allOf:
          - $ref: '#/definitions/group-management-source'
      status:
        type: string
        description: Outcome of the operation.
        enum:
          - CREATED
          - UPDATED
        example: "CREATED"
      unresolved_user_ids:
        type: array
        description: |
          Member user ids that are not existing AppZen users. These members are skipped; the request
          still succeeds and the rest of the group is applied.
        items:
          type: string
        example:
          - "az-user-99999"

################################################################################################################
#                                            APIs
################################################################################################################

paths:
  ######### PAYMENT TERM ##########
  /payment-term:
    post:
      tags:
        - Payment Terms
      summary: Creates/updates a payment term
      description: Creates a new payment term in AppZen. Returns a uuid for this payment term. When there already exists a payment term (with the same payment_term_id), then the operation is an update (in this case, the `status` in the response will be `UPDATED`).
      parameters:
        - $ref: '#/parameters/payment-terms-json-schema'
      responses:
        200:
          description: Updated
          schema:
            $ref: '#/definitions/uuid-updated'
        201:
          description: Created
          schema:
            $ref: '#/definitions/uuid'
        400:
          description: Bad Request
          schema:
            $ref: '#/definitions/http-400-error-response'
        401:
          description: Unauthorized
          schema:
            $ref: '#/definitions/http-401-error-response'
        403:
          description: Forbidden
          schema:
            $ref: '#/definitions/http-403-error-response'
        404:
          description: Not Found
          schema:
            $ref: '#/definitions/http-404-error-response'
        500:
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http-500-error-response'

  /payment-term/{uuid}:
    get:
      tags:
        - Payment Terms
      summary: Returns payment-term details
      description: Returns the details of a payment-term by uuid
      produces:
        - application/json
      parameters:
        - $ref: '#/parameters/uuid'
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/payment-term'
        400:
          description: Bad Request
          schema:
            $ref: '#/definitions/http-400-error-response'
        401:
          description: Unauthorized
          schema:
            $ref: '#/definitions/http-401-error-response'
        403:
          description: Forbidden
          schema:
            $ref: '#/definitions/http-403-error-response'
        404:
          description: Not Found
          schema:
            $ref: '#/definitions/http-404-error-response'
        500:
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http-500-error-response'

  /payment-term/payment-term-id/{payment-term-id}:
    get:
      tags:
        - Payment Terms
      summary: Returns payment-term details
      description: Returns the details of a payment-term with specific payment-term-id
      produces:
        - application/json
      parameters:
        - in: path
          description: external payment term identifier
          required: true
          name: payment-term-id
          type: string
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/payment-term'
        400:
          description: Bad Request
          schema:
            $ref: '#/definitions/http-400-error-response'
        401:
          description: Unauthorized
          schema:
            $ref: '#/definitions/http-401-error-response'
        403:
          description: Forbidden
          schema:
            $ref: '#/definitions/http-403-error-response'
        404:
          description: Not Found
          schema:
            $ref: '#/definitions/http-404-error-response'
        500:
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http-500-error-response'

  /payment-term/search:
    post:
      tags:
        - Payment Terms
      summary: Returns all Payment Terms uuid that match the search criteria
      description: Returns a list of the Payment Terms uuids that match from-date and end-date
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - $ref: '#/parameters/find-query-spec'
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/find-payment-terms-result-spec'
        400:
          description: Bad Request
          schema:
            $ref: '#/definitions/http-400-error-response'
        401:
          description: Unauthorized
          schema:
            $ref: '#/definitions/http-401-error-response'
        403:
          description: Forbidden
          schema:
            $ref: '#/definitions/http-403-error-response'
        404:
          description: Not Found
          schema:
            $ref: '#/definitions/http-404-error-response'
        500:
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http-500-error-response'


  ######### Chart of Account ##########
  /chart-of-accounts:
    post:
      tags:
        - Chart of Accounts
      summary: Creates a new chart of account segment
      description: Creates a new chart of account segment in AppZen and returns a uuid that uniquely identifies it. When there already exists a chart of account segment (segment_code), then the operation is an update (the `status` would be `UPDATED` in this case).
      parameters:
        - $ref: '#/parameters/chart-of-account-input-schema'
        - in: header
          name: segment-name-for-uniqueness
          type: boolean
          required: false
          default: false
          description: Flag to indicate whether the segment-name should be used to determine (in addition to segment-code and segment-type) whether the payload signifies a unique chart of account
        - in: header
          name: merge-segment-lookup-names
          type: boolean
          required: false
          default: false
          description: Flag to indicate whether the segment-lookup-names list in the payload should be concatenated to the corresponding list in an existing chart of account
      responses:
        200:
          description: Updated
          schema:
            $ref: '#/definitions/uuid-updated'
        201:
          description: Created
          schema:
            $ref: '#/definitions/uuid'
        400:
          description: Bad Request
          schema:
            $ref: '#/definitions/http-400-error-response'
        401:
          description: Unauthorized
          schema:
            $ref: '#/definitions/http-401-error-response'
        403:
          description: Forbidden
          schema:
            $ref: '#/definitions/http-403-error-response'
        404:
          description: Not Found
          schema:
            $ref: '#/definitions/http-404-error-response'
        500:
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http-500-error-response'

  /chart-of-accounts/{uuid}:
    get:
      tags:
        - Chart of Accounts
      summary: Returns a chart of account segment's details
      description: Returns the details of a chart of account segment by uuid
      produces:
        - application/json
      parameters:
        - $ref: '#/parameters/uuid'
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/chart-of-account-output-schema'
        400:
          description: Bad Request
          schema:
            $ref: '#/definitions/http-400-error-response'
        401:
          description: Unauthorized
          schema:
            $ref: '#/definitions/http-401-error-response'
        403:
          description: Forbidden
          schema:
            $ref: '#/definitions/http-403-error-response'
        404:
          description: Not Found
          schema:
            $ref: '#/definitions/http-404-error-response'
        500:
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http-500-error-response'

  /chart-of-accounts/search:
    post:
      tags:
        - Chart of Accounts
      summary: Returns all Chart of Accounts uuid that match the search criteria
      description: Returns a list of the Chart of Accounts uuids that match from-date and end-date
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - $ref: '#/parameters/find-query-spec'
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/find-chart-of-accounts-result-spec'
        400:
