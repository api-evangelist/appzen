                  - $ref: '#/definitions/purchase-order-condition'
              description: "Line-level PO conditions specific to this PO line (e.g., line-specific freight charges, taxes)"
          required:
            - line_number
            - gl_code
            - amount
            - uninvoiced_amount
            - purchase_order_line_status
            - appzen_purchase_order_line_status
    required:
      - entity_id
      - supplier_id
      - purchase_order_number
      - purchase_order_status
      - appzen_purchase_order_status
      - purchase_order_lines

  po-line-allocation:
    type: object
    description: An allocation for an purchase order line. Either amount/tax or percentage should be provided.
    required:
      - external_allocation_id
      - gl_code
    properties:
      external_allocation_id:
        type: string
        example: "xsd-1234"
      gl_code:
        type: string
        example: "1002.369.922.0000.0000"
      amount:
        type: number
        example: 25.6
      tax:
        example: 2.56
        type: number
      percentage:
        type: number
        example: 35
      allocation_quantity:
        type: number
        example: 2.5

  purchase-order-condition:
    type: object
    description: "Represents a condition on a PO (e.g., freight charges, taxes, discounts). Can be at header level (applying to entire PO) or line level (specific to a PO line)"
    required:
      - scope
      - po_header_id
      - condition_type
      - condition_basis
      - planned_amount
      - is_statistical
    properties:
      scope:
        type: string
        enum: [ 'HEADER', 'LINE' ]
        example: "HEADER"
        description: "Whether this condition applies to the entire PO (HEADER) or a specific PO line (LINE). Use HEADER for po_conditions; use LINE for po_line_conditions"
      po_header_id:
        type: string
        example: "PO-12345"
        description: "The PO identifier this condition belongs to"
      po_line_id:
        type: string
        example: "10"
        description: "The PO line identifier (required when scope is LINE, empty for HEADER scope)"
      condition_category:
        type: string
        enum:
          - PURCHASE_ORDER_CONDITION_CATEGORY_UNSPECIFIED
          - TAX_JUR_CODE_TRIGGER
          - TAX_EXEMPTION_LICENSE_VIA_CONDITIONS
          - TOTAL_CHARGES_IS_OIL
          - CHARGES_CONDITION_RECORDS_IS_OIL
          - TAX_JURISDICTION_LEVEL_1_WITH_LICENSE
          - TAX_JURISDICTION_LEVEL_2
          - TAX_JURISDICTION_LEVEL_3
          - TAX_JURISDICTION_LEVEL_4
          - CUSTOMER_RESERVE_5
          - CUSTOMER_RESERVE_6
          - CUSTOMER_RESERVE_7
          - CUSTOMER_RESERVE_8
          - CUSTOMER_RESERVE_9
          - PACKAGING
          - DELIVERY_COSTS
          - INSURANCE
          - CONDITION_TAX
          - CASH_DISCOUNT
          - CONDITION_FREIGHT
          - INTERNAL_PRICE
          - BASIC_PRICE
          - PRICE_FOR_INTERCOMPANY_BILLING
          - CUSTOMER_EXPECTED_PRICE
          - BASE_AMOUNT_EXCLUDING_TAX
          - GENERALLY_NEW_WHEN_COPYING
          - SALES_TAX_WITH_LICENSE_CHECKING
          - INPUT_TAX_NOT_DEDUCTIBLE
          - VARIANTS
          - BASE_AMOUNT_INCLUDING_TAX
          - COSTING
          - INVOICE_LIST_CONDITION
          - STANDARD_COST
          - MOVING_COST
          - DISCOUNT_SURCHARGE_FOR_PRECIOUS_METALS
          - PRICE_COMPONENT
          - EXPECTED_SALES_PRICE_INCLUDING_TAX
          - CUSTOMER_RESERVE_X
          - CUSTOMER_RESERVE_Y
          - CUSTOMER_RESERVE_Z
          - RESERVED_FIXED_EXTRA_PAY
          - TRANSFER_PRICE_FOR_GROUP_VALUATION
          - TRANSFER_PRICE_FOR_PROFIT_CENTERS
          - CONFIRMED_PURCHASE_NET_PRICE
          - DOWN_PAYMENT_REQUEST
          - FREE_GOODS_INCLUSIVE
          - CONDITION_PAYMENT
          - PROFIT_CENTER_COST
          - SHIP_AND_DEBIT_1_IBU_HITEC
          - SHIP_AND_DEBIT_2_IBU_HITEC
          - TP_ILV_BASE_TARIF_COVERS_COSTS
          - SSR_DISCOUNT_IS_OIL
          - PROFIT_CENTER_INTERNAL_PRICE_ROUTE
          - AFS_SEASON_DETERMINATION
          - SSR_PARTNER_COMMISSION_IS_OIL
          - AFS_VALUE_ADDED_SERVICES
        example: "CONDITION_FREIGHT"
        description: "The category of the condition (informational, not used for matching)"
      condition_type:
        type: string
        example: "FRA1"
        description: "The condition type code from ERP (e.g., FRA1, TAX1). This is the primary matching key used to link invoice line conditions to PO conditions"
      condition_supplier_id:
        type: string
        example: "CARRIER_001"
        description: "The supplier/vendor ID assigned to handle this condition (e.g., freight carrier, tax authority). Used for vendor mismatch validation"
      condition_basis:
        type: string
        enum: [ 'AMOUNT_BASIS', 'QUANTITY_BASIS', 'PERCENTAGE_BASIS' ]
        example: "AMOUNT_BASIS"
        description: "The basis on which this condition is calculated"
      planned_amount:
        allOf:
          - $ref: '#/definitions/amount'
          - description: "The originally planned/budgeted amount for this condition"
      max_invoiceable_amount:
        allOf:
          - $ref: '#/definitions/amount'
          - description: "[Deprecated] Maximum amount that can be invoiced against this condition. Use uninvoiced_amount instead"
        deprecated: true
      uninvoiced_amount:
        allOf:
          - $ref: '#/definitions/amount'
          - description: "The remaining amount available to invoice against this condition. This is the key field used for out-of-funds validation"
      is_statistical:
        type: boolean
        example: false
        description: "Whether this condition is statistical (included in PO total) or non-statistical (not included in PO total)"

  goods-receipt:
    type: object
    properties:
      receipt_id:
        type: string
        example: "123AB"
        description: "The Receipt ID from source system"
      receipt_number:
        type: string
        example: "R1"
        description: "The receipt number visible/present in invoice pdf/image"
      receipt_type:
        type: string
        example: "TYPE_1"
        description: "The type of receipt"
      purchase_order_number:
        type: string
        example: "000010232"
        description: "The unique purchase order identifier in the source system that matches with the purchase order reference sent in purchase order header file."
      purchase_order_line_number:
        type: integer
        format: int32
        example: 1
        description: "The reference of the purchase order line"
      po_external_unique_id:
        type: string
        example: "A000010232"
        description: "The unique purchase order identifier in the source system the external system which uniquely identities a PO."
      receipt_date:
        allOf:
          - $ref: '#/definitions/date'
          - description: "The date when the receipt has been created"
      unit_of_measure:
        type: string
        example: "UOM"
        description: "The unit of measurement"
      unit_price:
        allOf:
          - $ref: '#/definitions/amount'
          - description: "Unit price of item in the receipt along with currency"
      receipt_quantity:
        type: integer
        format: int32
        example: 10
        description: "The total quantity of the receipt"
      receipt_amount:
        allOf:
          - $ref: '#/definitions/amount'
          - description: "Total amount of the receipt along with currency"
      open_amount:
        allOf:
          - $ref: '#/definitions/amount'
          - description: "Open amount available to allocate to invoices of the receipt along with currency"
      open_quantity:
        type: integer
        format: int32
        example: 10
        description: "available to allocate to invoices of the receipt"

  suppliers-json-schema:
    type: object
    required:
      - supplier_core
      - addresses
    properties:
      supplier_core:
        type: object
        required:
          - external_supplier_id
          - supplier_name
        properties:
          external_supplier_id:
            type: string
            example: "691759"
          supplier_name:
            type: string
            example: "ABC Suppliers Inc."
          supplier_number:
            type: string
            example: "2342112"
          web_site:
            type: string
            example: "abcsuppliers.com"
          on_file_1099:
            type: string
            example: "3DMWWFF"
          vat_registration_number:
            type: string
            example: "D08J66"
            deprecated: true
          tax_registration_numbers:
            type: array
            items:
              type: string
            example: [ "D08J6671736", "ABC123456" ]
          fed_tax_id:
            type: string
            example: "GI19E"
          is_active:
            default: true
            type: boolean
          is_one_time:
            type: boolean
            default: false
            description: |
              Marks this record as a one-time / CPD (Conpicuous Posting Document)
              supplier. When `is_one_time` is `true`, only `external_supplier_id`,
              `entities_list`, `is_one_time` and the status flags
              (`is_active` / `supplier_status`) are accepted on the master record
              — `supplier_name` and other fields outside the CPD surface are
              optional and silently ignored. Name, address, banking, tax
              registration etc. are captured per-invoice on the invoice payload
              rather than on the master.
            example: false
          deactive_date:
            allOf:
              - $ref: '#/definitions/date-time'
          deactived_by:
            type: string
            example: "JOHN.DOE@ABC.COM"
          note:
            default: ''
            type: string
            example: "Category A Supplier"
      addresses:
        allOf:
          - $ref: '#/definitions/addresses'
      contacts:
        type: array
        items:
          type: object
          properties:
            external_contact_id:
              type: string
              example: "4266477"
            first_name:
              type: string
              example: "John"
            last_name:
              type: string
              example: "Doe"
            email:
              type: string
              example: "john.doe@abc.com"
            phone_number:
              type: string
              example: "4081234567"
      payment_term_id:
        type: string
        description: This value should be unique in the customer’s ERP system to distinguish payment terms
        example: "652402"
      bank_information:
        type: object
        properties:
          bank_acct_last4:
            type: string
            example: "8674"
          routing_number_last4:
            type: string
            example: "6521"
          bank_account_name:
            type: string
            example: "ABC Bank"
          bank_account_type:
            type: string
            example: "Checking"
      entities_list:
        description: list of external identifier for entities that this supplier is associated with
        type: array
        items:
          type: string
      payment_types:
        type: array
        items:
          type: string
        example:
          [ "CREDIT","CASH", "WIRE" ]
      custom_json:
        type: object
        properties:
          key1:
            type: "string"
            example: "value1"
      supplier_lookup_names:
        type: array
        description: List of supplier lookup names associated with this supplier.
        example: [ "s1", "s3" ]
      wht_tax_ids:
        type: array
        description: List of tax ids fo withholding tax category
        example: [ "T1", "WHT1" ]
      entities_banking_details:
        type: array
        items:
          type: object
          properties:
            entity_id:
              type: string
              description: "Unique identifier for the entity"
              example: "ENT001"
            payment_block:
              type: boolean
              description: "Indicates if payments are blocked for this entity"
              example: false
            payment_block_reason:
              type: string
              description: "Reason for payment block if payments are blocked"
              example: "Pending compliance review"
            payment_types:
              type: array
              description: "List of supported payment types for this entity"
              example: ["ACH", "DOMESTIC_WIRE"]
              items:
                type: string
                allOf:
                  - $ref: "#/definitions/payment_type"
            default_payment_type:
              type: string
              description: "Default payment type for this entity"
              example: "ACH"
              allOf:
                - $ref: "#/definitions/payment_type"
            default_payment_term_id:
              type: string
              description: "Default payment term identifier for this entity"
              example: "NET30"
            default_house_bank:
              type: string
              description: "Default house bank identifier for this entity"
              example: "HB001"
            intercompany_flag:
              type: boolean
              description: "Indicates if this is an intercompany entity"
              example: false
            bank_information:
              type: array
              items:
                type: object
                properties:
                  part_bank_key:
                    type: string
                    description: "Unique identifier for the bank account"
                    example: "BANK001"
                  account_id:
                    type: string
                    description: "Account identifier"
                    example: "ACC123456"
                  iban:
                    type: string
                    description: "International Bank Account Number"
                    example: "GB29NWBK60161331926819"
                  swift_bic:
                    type: string
                    description: "SWIFT Business Identifier Code"
                    example: "NWBKGB2L"
                  currency:
                    type: string
                    description: "Currency code for the account"
                    example: "USD"
                  name:
                    type: string
                    description: "Name of the bank account"
                    example: "Main Business Account"
                  account_type:
                    allOf:
                      - $ref: "#/definitions/bank_account_type"
                    description: "Type of bank account"
                  country:
                    type: string
                    description: "Country where the bank is located"
                    example: "US"
                  contact:
                    type: string
                    description: "Contact information for the bank account"
                    example: "John Doe - john.doe@company.com"
                  account_number:
                    type: string
                    description: "Bank account number"
                    example: "1234567890"
                  routing_number:
                    type: string
                    description: "Bank routing number"
                    example: "021000021"
                  is_primary:
                    type: boolean
                    description: "Indicates if this is the primary bank account"
                    example: true
      global_banking_details:
        type: object
        description: "Global banking details for the supplier (not entity-specific)"
        properties:
          payment_block:
            type: boolean
            description: "Indicates if payments are blocked globally"
            example: false
          payment_block_reason:
            type: string
            description: "Reason for payment block if payments are blocked"
            example: "Pending compliance review"
          payment_types:
            type: array
            description: "List of supported payment types globally"
            example: ["ACH", "DOMESTIC_WIRE"]
            items:
              type: string
              allOf:
                - $ref: "#/definitions/payment_type"
          default_payment_type:
            type: string
            description: "Default payment type globally"
            example: "ACH"
            allOf:
              - $ref: "#/definitions/payment_type"
          default_payment_term_id:
            type: string
            description: "Default payment term identifier globally"
            example: "NET30"
          default_house_bank:
            type: string
            description: "Default house bank identifier globally"
            example: "HB001"
          intercompany_flag:
            type: boolean
            description: "Indicates if this is an intercompany supplier"
            example: false
          bank_information:
            type: array
            items:
              type: object
              properties:
                part_bank_key:
                  type: string
                  description: "Unique identifier for the bank account"
                  example: "BANK001"
                account_id:
                  type: string
                  description: "Account identifier"
                  example: "ACC123456"
                iban:
                  type: string
                  description: "International Bank Account Number"
                  example: "GB29NWBK60161331926819"
                swift_bic:
                  type: string
                  description: "SWIFT Business Identifier Code"
                  example: "NWBKGB2L"
                currency:
                  type: string
                  description: "Currency code for the account"
                  example: "USD"
                name:
                  type: string
                  description: "Name of the bank account"
                  example: "Main Business Account"
                account_type:
                  allOf:
                    - $ref: "#/definitions/bank_account_type"
                  description: "Type of bank account"
                country:
                  type: string
                  description: "Country where the bank is located"
                  example: "US"
                contact:
                  type: string
                  description: "Contact information for the bank account"
                  example: "John Doe - john.doe@company.com"
                account_number:
                  type: string
                  description: "Bank account number"
                  example: "1234567890"
                routing_number:
                  type: string
                  description: "Bank routing number"
                  example: "021000021"
                is_primary:
                  type: boolean
                  description: "Indicates if this is the primary bank account"
                  example: true
      entities_other_fields:
        type: array
        description: "Entity-specific custom fields for the supplier. Each entry contains an entity_id and a set of key-value pairs (other_fields). Entity IDs are validated against entity master data — if an entity_id is not found, supplier ingestion fails. Values can be any type (strings, numbers, booleans, arrays, objects) — non-string values are stringified for storage."
        items:
          type: object
          required:
            - entity_id
          properties:
            entity_id:
              type: string
              description: "External identifier for the entity. Must exist in entity master data."
              example: "ENT-INDIA"
            other_fields:
              type: object
              description: "Arbitrary key-value pairs for entity-specific custom fields. Values can be any type — non-string values are stringified for storage."
              example:
                poRequirementMode: "FORBIDDEN"
                allowedCurrencies: ["INR", "USD"]
                invoiceAmountHardThreshold:
                  amount: 50000
                  currency: "USD"

