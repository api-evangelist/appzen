  exchange-rate:
    description: Optional. If the exchange_rate is provided, then all three fields (from_currency_code, to_currency_code and conversion_rate) are required.
    example:
      from_currency_code: USD
      to_currency_code: EUR
      conversion_rate: 0.92
    required:
    - from_currency_code
    - to_currency_code
    - conversion_rate
    properties:
      conversion_rate:
        type: number
        example: 0.92
      from_currency_code:
        type: string
        example: USD
      to_currency_code:
        type: string
        example: EUR
    type: object
  date:
    type: string
    format: date
    example: '2020-11-01'
    description: date should be in UTC format
