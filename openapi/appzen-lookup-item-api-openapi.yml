openapi: 3.2.0
info:
  title: Autonomous AP Lookup Item API
  description: Public APIs for integrating with Autonomous AP
  version: 2.0.3
servers:
- url: https://<env>.appzen.com/dictionary-data-services
security:
- API Key Header: []
  Customer Id Header: []
  Customer Key Header: []
tags:
- name: Lookup Item
paths:
  /lookup:
    post:
      tags:
      - Lookup Item
      summary: Creates/updates a Lookup Item associated with a Look up Table
      description: 'Creates a new Lookup Item. Returns a uuid for this lookup item.

        When there already exists a lookup item (with the same lookup_item_name and lookup_item_id), then the operation is an update (in this case, the `status` in the response will be `UPDATED`).'
      parameters:
      - $ref: '#/components/parameters/lookup-json-schema'
      responses:
        200:
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/uuid-updated'
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/uuid'
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http-400-error-response'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http-401-error-response'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http-403-error-response'
        404:
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http-404-error-response'
        500:
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http-500-error-response'
      operationId: postLookup
      x-operation-id-source: derived
  /lookup/{uuid}:
    get:
      tags:
      - Lookup Item
      summary: Returns Lookup Item details
      description: Returns the details of a Lookup Item by its Appzen uuid
      parameters:
      - $ref: '#/components/parameters/uuid'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/lookup-get'
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http-400-error-response'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http-401-error-response'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http-403-error-response'
        404:
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http-404-error-response'
        500:
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http-500-error-response'
      operationId: getLookupByUuid
      x-operation-id-source: derived
  /lookup/lookup-name-id/{lookup-name-id}/lookup-item-id/{lookup-item-id}:
    get:
      tags:
      - Lookup Item
      summary: Returns Lookup Item details
      description: Returns the details of a Lookup Item matching the lookup-name-id and its external lookup-item-id
      parameters:
      - $ref: '#/components/parameters/lookup-name-id'
      - $ref: '#/components/parameters/lookup-item-id'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/lookup-get'
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http-400-error-response'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http-401-error-response'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http-403-error-response'
        404:
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http-404-error-response'
        500:
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http-500-error-response'
      operationId: getLookupLookupNameIdByLookupNameIdLookupItemIdByLookupItemId
      x-operation-id-source: derived
components:
  schemas:
    http-403-error-response:
      type: object
      properties:
        timestamp:
          type: string
          example: 2019-01-17T16:12:45.977+0000
        status:
          type: string
          example: 403
        error:
          type: string
          example: Forbidden
        message:
          type: string
          example: 'Error code : 17e3338d - You do not have permission to access this resource'
    uuid-updated:
      type: object
      properties:
        uuid:
          type: string
          example: 5fc03087-d265-11e7-b8c6-83e29cd24f4c
        status:
          type: string
          example: UPDATED
    http-401-error-response:
      type: object
      properties:
        timestamp:
          type: string
          example: 2019-01-17T16:12:45.977+0000
        status:
          type: string
          example: 401
        error:
          type: string
          example: Unauthorized
        message:
          type: string
          example: 'Error code : 17e3338d - Unable to authenticate credentials'
    http-400-error-response:
      type: object
      properties:
        timestamp:
          type: string
          example: 2019-01-17T16:12:45.977+0000
        status:
          type: string
          example: 400
        error:
          type: string
          example: Bad Request
        message:
          type: string
          example: 'Error code : 17e3338d - Invalid request, please fix and resend'
    lookup:
      properties:
        lookup_name_id:
          description: Lookup Table Id for this Lookup Item
          type: string
          example: TAX_APPLICABILITY
        lookup_item_id:
          example: XDES322
          description: Lookup Item Id from ERP system.
          type: string
        lookup_item_name:
          example: EMEA Region
          description: Lookup Item Name.
          type: string
        lookup_item_description:
          example: Tax Applicability in EMEA Region
          description: Lookup Item Description.
          type: string
        is_active:
          description: Is lookup active in the ERP system.
          default: true
          type: boolean
        parent_lookup_item_id:
          example: Euroasia
          description: deprecated - please use 'parent_lookup_item_ids' instead
          type: string
        parent_lookup_item_ids:
          example:
          - Euroasia
          - XDES323
          description: Parent Lookup Item Ids from ERP system.
          type: string
        created_at:
          allOf:
          - $ref: '#/components/schemas/date-time'
        updated_at:
          allOf:
          - $ref: '#/components/schemas/date-time'
      required:
      - lookup_name_id
      - lookup_item_id
      - lookup_item_name
    date-time:
      type: string
      format: date-time
      example: '2024-03-01T11:01:00Z'
      description: date should be in UTC format
    lookup-get:
      properties:
        lookup_name_id:
          description: Lookup Table Id for the Lookup Item
          type: string
          example: TAX_APPLICABILITY
        lookup_item_id:
          example: XDES322
          description: Lookup Item ID from ERP system.
          type: string
        lookup_item_name:
          example: EMEA Region
          description: Lookup Item Name.
          type: string
        lookup_item_description:
          example: Tax Applicability in EMEA Region
          description: Lookup Item Description.
          type: string
        is_active:
          description: Is lookup active in the ERP system.
          default: true
          type: boolean
        parent_lookup_name_id:
          description: Parent Lookup Table Id for parent Lookup Item
          type: string
          example: REGION
        parent_lookup_item_id:
          example: Euroasia
          description: Parent Lookup Item Id from ERP system.
          type: string
        parent_lookup_item_ids:
          example:
          - Euroasia
          - XDES323
          description: Parent Lookup Item Ids from ERP system.
          type: string
        created_at:
          allOf:
          - $ref: '#/components/schemas/date-time'
        updated_at:
          allOf:
          - $ref: '#/components/schemas/date-time'
        uuid:
          type: string
          example: 0045-89707-0906-DE3C
    uuid:
      type: object
      properties:
        uuid:
          type: string
          example: 5fc03087-d265-11e7-b8c6-83e29cd24f4c
        status:
          type: string
          example: CREATED
    http-404-error-response:
      type: object
      properties:
        timestamp:
          type: string
          example: 2019-01-17T16:12:45.977+0000
        status:
          type: string
          example: 404
        error:
          type: string
          example: Not Found
        message:
          type: string
          example: 'Error code : 17e3338d - The resource you specified cannot be not found'
    http-500-error-response:
      type: object
      properties:
        timestamp:
          type: string
          example: 2019-01-17T16:12:45.977+0000
        status:
          type: string
          example: 500
        error:
          type: string
          example: Internal Server Error
        message:
          type: string
          example: 'Error code : 17e3338d - Unable to process your request at this moment, please try again later'
  parameters:
    lookup-json-schema:
      in: body
      required: true
      name: lookup-json-schema
      schema:
        $ref: '#/components/schemas/lookup'
    lookup-name-id:
      in: path
      description: lookup table name id
      required: true
      name: lookup-name-id
      schema:
        type: string
    uuid:
      in: path
      description: Globally unique identifier for an uploaded document
      required: true
      name: uuid
      schema:
        type: string
    lookup-item-id:
      in: path
      description: lookup item id
      required: true
      name: lookup-item-id
      schema:
        type: string
  securitySchemes:
    API_Key_Header:
      type: apiKey
      in: header
      name: x-api-key
    Customer_Id_Header:
      type: apiKey
      in: header
      name: customer-id
    Customer_Key_Header:
      type: apiKey
      in: header
      name: customer-key
