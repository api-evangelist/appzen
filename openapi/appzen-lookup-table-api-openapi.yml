openapi: 3.2.0
info:
  title: Autonomous AP Lookup Table API
  description: Public APIs for integrating with Autonomous AP
  version: 2.0.3
servers:
- url: https://<env>.appzen.com/dictionary-data-services
security:
- API Key Header: []
  Customer Id Header: []
  Customer Key Header: []
tags:
- name: Lookup Table
paths:
  /lookup-table:
    post:
      tags:
      - Lookup Table
      summary: Creates/updates a Lookup Table
      description: 'Creates a new Lookup Table. Returns a uuid for this lookup table.

        When there already exists a lookup table (with the same lookup_name_id), then the operation is an update (in this case, the `status` in the response will be `UPDATED`).'
      parameters:
      - $ref: '#/components/parameters/lookup-table-json-schema'
      responses:
        200:
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/uuid-updated'
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/uuid'
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http-400-error-response'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http-401-error-response'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http-403-error-response'
        404:
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http-404-error-response'
        500:
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http-500-error-response'
      operationId: postLookupTable
      x-operation-id-source: derived
    get:
      tags:
      - Lookup Table
      summary: Returns list of Lookup Tables
      description: Returns the list of Lookup Tables
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                  - $ref: '#/components/schemas/lookup-table-get'
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http-400-error-response'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http-401-error-response'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http-403-error-response'
        404:
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http-404-error-response'
        500:
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http-500-error-response'
      operationId: getLookupTable
      x-operation-id-source: derived
  /lookup-table/{uuid}:
    get:
      tags:
      - Lookup Table
      summary: Returns Lookup Table details given its uuid
      description: Returns the details of a Lookup Table by uuid
      parameters:
      - $ref: '#/components/parameters/uuid'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/lookup-table-get'
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http-400-error-response'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http-401-error-response'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http-403-error-response'
        404:
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http-404-error-response'
        500:
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http-500-error-response'
      operationId: getLookupTableByUuid
      x-operation-id-source: derived
  /lookup-table/lookup-name-id/{lookup-name-id}:
    get:
      tags:
      - Lookup Table
      summary: Returns Lookup Table details given its external lookup-name-id
      description: Returns the details of a Lookup Table matching its external lookup-name-id
      parameters:
      - $ref: '#/components/parameters/lookup-name-id'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/lookup-table-get'
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http-400-error-response'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http-401-error-response'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http-403-error-response'
        404:
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http-404-error-response'
        500:
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http-500-error-response'
      operationId: getLookupTableLookupNameIdByLookupNameId
      x-operation-id-source: derived
components:
  schemas:
    http-403-error-response:
      type: object
      properties:
        timestamp:
          type: string
          example: 2019-01-17T16:12:45.977+0000
        status:
          type: string
          example: 403
        error:
          type: string
          example: Forbidden
        message:
          type: string
          example: 'Error code : 17e3338d - You do not have permission to access this resource'
    uuid-updated:
      type: object
      properties:
        uuid:
          type: string
          example: 5fc03087-d265-11e7-b8c6-83e29cd24f4c
        status:
          type: string
          example: UPDATED
    http-401-error-response:
      type: object
      properties:
        timestamp:
          type: string
          example: 2019-01-17T16:12:45.977+0000
        status:
          type: string
          example: 401
        error:
          type: string
          example: Unauthorized
        message:
          type: string
          example: 'Error code : 17e3338d - Unable to authenticate credentials'
    lookup-table-get:
      properties:
        lookup_name_id:
          example: TAX_APPLICABILITY
          description: Lookup Table ID.
          type: string
        lookup_name:
          description: Lookup Name in the ERP system
          type: string
          example: TAX APPLICABILITY
        parent_lookup_name_id:
          example: REGION
          description: Parent Lookup Table ID.
          type: string
        lookup_description:
          example: This Lookup Table provides Tax Applicability Information in Different Regions
          description: Lookup Table Description.
          type: string
        is_active:
          description: Is lookup active in the ERP system.
          default: true
          type: boolean
        created_at:
          allOf:
          - $ref: '#/components/schemas/date-time'
        updated_at:
          allOf:
          - $ref: '#/components/schemas/date-time'
        uuid:
          type: string
          example: 0045-89707-0906-DE3C
    http-400-error-response:
      type: object
      properties:
        timestamp:
          type: string
          example: 2019-01-17T16:12:45.977+0000
        status:
          type: string
          example: 400
        error:
          type: string
          example: Bad Request
        message:
          type: string
          example: 'Error code : 17e3338d - Invalid request, please fix and resend'
    lookup-table:
      properties:
        lookup_name_id:
          example: TAX_APPLICABILITY
          description: Lookup Table ID.
          type: string
        lookup_name:
          description: Lookup Name in the ERP system
          type: string
          example: TAX APPLICABILITY
        parent_lookup_name_id:
          example: REGION
          description: Parent Lookup Table ID.
          type: string
        lookup_description:
          example: This Lookup Table provides Tax Applicability Information in Different Regions
          description: Lookup Table Description.
          type: string
        is_active:
          description: Is lookup active in the ERP system.
          default: true
          type: boolean
        created_at:
          allOf:
          - $ref: '#/components/schemas/date-time'
        updated_at:
          allOf:
          - $ref: '#/components/schemas/date-time'
      required:
      - lookup_name_id
      - lookup_name
    date-time:
      type: string
      format: date-time
      example: '2024-03-01T11:01:00Z'
      description: date should be in UTC format
    uuid:
      type: object
      properties:
        uuid:
          type: string
          example: 5fc03087-d265-11e7-b8c6-83e29cd24f4c
        status:
          type: string
          example: CREATED
    http-404-error-response:
      type: object
      properties:
        timestamp:
          type: string
          example: 2019-01-17T16:12:45.977+0000
        status:
          type: string
          example: 404
        error:
          type: string
          example: Not Found
        message:
          type: string
          example: 'Error code : 17e3338d - The resource you specified cannot be not found'
    http-500-error-response:
      type: object
      properties:
        timestamp:
          type: string
          example: 2019-01-17T16:12:45.977+0000
        status:
          type: string
          example: 500
        error:
          type: string
          example: Internal Server Error
        message:
          type: string
          example: 'Error code : 17e3338d - Unable to process your request at this moment, please try again later'
  parameters:
    lookup-name-id:
      in: path
      description: lookup table name id
      required: true
      name: lookup-name-id
      schema:
        type: string
    lookup-table-json-schema:
      in: body
      required: true
      name: lookup-json-schema
      schema:
        $ref: '#/components/schemas/lookup-table'
    uuid:
      in: path
      description: Globally unique identifier for an uploaded document
      required: true
      name: uuid
      schema:
        type: string
  securitySchemes:
    API_Key_Header:
      type: apiKey
      in: header
      name: x-api-key
    Customer_Id_Header:
      type: apiKey
      in: header
      name: customer-id
    Customer_Key_Header:
      type: apiKey
      in: header
      name: customer-key
