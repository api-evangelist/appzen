aid: appzen
name: AppZen
description: >-
  AppZen is an AI platform for finance teams that automates accounts payable
  and expense auditing. Its Autonomous AP product ingests invoices, purchase
  orders, goods receipts and supporting master data, then applies AI to run
  validation checks, assign risk scores, and audit spend before payment. The
  public Autonomous AP REST API (Swagger 2.0, 54 operations) lets ERP and
  accounting systems such as SAP, Oracle, NetSuite, Coupa, Workday and
  Microsoft Dynamics push documents into AppZen and retrieve audit results.
  Authentication is via three API-key headers issued by AppZen Support, with
  US sandbox and production environments (EU coming soon).
